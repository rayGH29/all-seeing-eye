[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "all-seeing-eye"
version = "0.1.0"
description = "Modular, local OSINT system with pluggable integrations and LLM-driven cross-referencing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "ry" }]
keywords = ["osint", "cli", "recon", "modular", "llm"]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Cloud LLM providers are optional so the pipeline runs offline with --no-llm.
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.34"]
llm = ["openai>=1.0", "anthropic>=0.34"]
# The Sherlock plugin shells out to the Sherlock CLI (external tool).
sherlock = ["sherlock-project>=0.15"]

[project.scripts]
aseye = "aseye.cli:app"

[tool.setuptools.packages.find]
include = ["aseye*"]
