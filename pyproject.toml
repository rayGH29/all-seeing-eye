[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "all-seeing-eye"
version = "0.1.0"
description = "Modular, local OSINT system with pluggable integrations and LLM-driven cross-referencing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "ry" }]
keywords = ["osint", "cli", "recon", "modular", "llm"]

dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
# Note: AI insights run on a local model via Ollama over HTTP (httpx), so no
# extra Python LLM package is required — just install Ollama and pull a model.
# Keyless external OSINT tools used by their respective plugins.
sherlock = ["sherlock-project>=0.15"]
maigret = ["maigret>=0.4"]
socialscan = ["socialscan>=1.4"]
holehe = ["holehe>=1.6"]
# Everything above at once.
tools = ["sherlock-project>=0.15", "maigret>=0.4", "socialscan>=1.4", "holehe>=1.6"]

[project.scripts]
aseye = "aseye.cli:app"

[tool.setuptools.packages.find]
include = ["aseye*"]
