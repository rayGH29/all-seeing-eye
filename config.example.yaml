# all-seeing-eye — example configuration.
#
# Copy this file to `config.yaml` (or run `aseye config init`) and edit it.
# `config.yaml` is gitignored.
#
# Insights run on a LOCAL model — nothing is sent to any third-party API.

llm:
  # Whether to run the merged report through a local LLM for
  # cross-referencing/insights. Override per-run with the --no-llm flag.
  enabled: true
  # Local backend. Currently supported: "ollama".
  provider: ollama
  # Model to use — must already be pulled, e.g. `ollama pull llama3.1`.
  model: llama3.1
  # Where the local model server is listening.
  host: http://localhost:11434
  # Max tokens for the insights response.
  max_tokens: 1500
  temperature: 0.2
  # How long to wait for the local model to respond (seconds). Local
  # generation can be slow on CPU-only machines.
  timeout: 300

plugins:
  # The bundled plugins and your user folder (~/.all-seeing-eye/plugins) are
  # ALWAYS discovered, from any directory. Set `dir` to an extra folder to also
  # load plugins from there (absolute, or relative to the current directory).
  # Leave empty for none.
  dir: ""
  # If non-empty, ONLY these plugins run (allowlist by plugin name).
  # Leave empty to run every discovered plugin that isn't disabled.
  enabled: []
  # Plugins to always skip (denylist by plugin name).
  disabled: []
  # Optional per-plugin settings, keyed by plugin name. Passed to run().
  # Examples:
  #   sherlock:
  #     request_timeout: 15     # per-site request timeout
  #     sites: [GitHub, Reddit] # limit to specific sites (empty = all)
  #   maigret:
  #     top_sites: 300          # how many top-ranked sites to scan
  #   holehe:
  #     password_recovery: false  # true may send recovery emails to the target
  #   toutatis:
  #     # Instagram sessionid cookie. Prefer the TOUTATIS_SESSIONID env var.
  #     sessionid: ""
  #   hibp:
  #     # Prefer the HIBP_API_KEY env var over putting the key here.
  #     api_key: ""
  settings: {}

output:
  # Where generated reports are written.
  dir: reports
  # Default report format: "json", "md", or "both".
  format: both

concurrency:
  # How many plugins to run in parallel.
  max_workers: 8
  # Per-plugin hard timeout in seconds.
  timeout: 120
